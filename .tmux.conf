# Enable colors (also add to .bashrc: force_color_prompt=yes)
set -g default-terminal "screen-256color"

# Set scrollback history to 50k lines (default is 2k)
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Use Ctrl+Space as the prefix.
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Remap splitting keybindings to be easier to remember.
bind '\' split-window -h
bind '-' split-window -v

# Enable mouse support (scrolling, switching windows, switching panes, resizing panes)
setw -g mouse on

# Let applications see whether they have focus
set -g focus-events on

# Reduce vim switching delay from 500 ms to 50 ms (http://superuser.com/a/252717/65504)
# If I get phantom inputs (esp pastes), then increasing this value should eliminate them.
set -s escape-time 50

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Copy to the system clipboard via OSC 52 (set by the terminal emulator itself),
# so it survives laptop hibernation.
# Note that this only works over ssh, not mosh, since mosh doesn't support OSC 52.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# https://stackoverflow.com/questions/51639540/tmux-scroll-mode-vim-keybindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
# map copy mode to Ctrl+Alt+C
bind-key -n 'C-M-c' copy-mode

# Edit the full scrollback buffer in nvim (prefix + e), opening at the latest output.
# NVIM_APPNAME is set explicitly: the popup's non-login shell doesn't source
# .bash_profile, so without this nvim loads ~/.config/nvim (empty) not the LazyVim config.
bind e run-shell 'f=$(mktemp ${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX); tmux capture-pane -pJ -S - -t "#{pane_id}" > "$f"; tmux display-popup -E -w 90% -h 90% "NVIM_APPNAME=lazyvim nvim + \"$f\"; rm -f \"$f\""'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

